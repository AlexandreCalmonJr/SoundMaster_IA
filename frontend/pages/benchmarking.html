<section id="benchmarking" class="module page-section">
    <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-12">
        <div class="flex items-center gap-4">
            <span class="p-3 bg-cyan-900/40 rounded-2xl text-2xl" aria-hidden="true">⚖️</span>
            <div>
                <h2 class="text-3xl font-black text-white tracking-tighter">Benchmarking Acústico</h2>
                <p class="text-slate-400 font-medium">Compare o desempenho da sala em diferentes cenários</p>
            </div>
        </div>
        <button id="btn-refresh-history" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-2xl text-xs font-black uppercase tracking-widest transition-all shadow-lg shadow-cyan-900/20 flex items-center gap-2">
            <span>🔄</span> Atualizar Histórico
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Gráfico de Comparação -->
        <div class="bg-slate-900/80 border border-white/10 rounded-xl p-8">
            <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-8">Curva de Decaimento (RT60)</h3>
            <div class="h-64 bg-black/70 rounded-xl relative flex items-end p-4 gap-2">
                <!-- Barras Comparativas -->
                <div id="bench-empty-bar" class="flex-1 bg-cyan-500/50 rounded-t-lg h-[80%] relative group transition-all duration-500">
                    <span class="absolute -top-6 left-0 text-[9px] text-cyan-400 font-bold">VAZIO: <span id="bench-empty-rt60">1.8s</span></span>
                </div>
                <div id="bench-full-bar" class="flex-1 bg-green-500/50 rounded-t-lg h-[60%] relative group transition-all duration-500">
                    <span class="absolute -top-6 left-0 text-[9px] text-green-400 font-bold">CHEIO: <span id="bench-full-rt60">1.4s</span></span>
                </div>
            </div>
            <p class="mt-6 text-[11px] text-slate-400 italic">O público presente ajuda a absorver frequências médias e agudas, reduzindo o reverb.</p>
        </div>

        <!-- Snapshots Salvos -->
        <div class="bg-slate-900/80 border border-white/10 rounded-xl p-8">
            <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-6">Histórico de Medições</h3>
            <div id="bench-history-list" class="space-y-3">
                <div class="text-center py-6 text-slate-500 text-xs">Carregando histórico...</div>
            </div>
        </div>
    </div>
</section>
