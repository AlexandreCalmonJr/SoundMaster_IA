<section id="ai-chat" class="module page-section">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-white">Assistente IA Autônomo</h2>
        <p class="text-slate-400 text-sm">Peça para analisar, medir ou ajustar — a IA faz tudo automaticamente.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8">
        <!-- Ferramentas da IA -->
        <div class="xl:col-span-1 space-y-6">
            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5">
                <label for="ai-target-channel" class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 block">Canal Alvo</label>
                <div class="flex items-center gap-3">
                    <input id="ai-target-channel" type="number" min="1" max="24" value="1"
                        class="bg-black/40 border border-white/10 rounded-lg px-4 py-2 text-cyan-400 font-mono w-20 focus:border-cyan-500 outline-none" 
                        aria-label="Selecionar canal de áudio alvo (1-24)">
                    <span class="text-slate-400 text-sm">canal selecionado</span>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">O que posso fazer</h3>
                <div class="space-y-2">
                    <button class="sound-ai-prompt w-full text-left p-3 rounded-xl bg-slate-700/50 hover:bg-cyan-900/30 border border-white/5 hover:border-cyan-500/50 text-xs transition-all" 
                        data-prompt="Analise o som da sala agora">🎧 Analisar Som</button>
                    <button class="sound-ai-prompt w-full text-left p-3 rounded-xl bg-slate-700/50 hover:bg-cyan-900/30 border border-white/5 hover:border-cyan-500/50 text-xs transition-all" 
                        data-prompt="Meça o RT60 da sala">📐 Medir RT60</button>
                    <button class="sound-ai-prompt w-full text-left p-3 rounded-xl bg-slate-700/50 hover:bg-cyan-900/30 border border-white/5 hover:border-cyan-500/50 text-xs transition-all" 
                        data-prompt="Que som está soando aqui?">🎤 Identificar Som</button>
                    <button class="sound-ai-prompt w-full text-left p-3 rounded-xl bg-slate-700/50 hover:bg-cyan-900/30 border border-white/5 hover:border-cyan-500/50 text-xs transition-all" 
                        data-prompt="Auditar mixer e verificar problemas">🔍 Auditar Mixer</button>
                    <button class="sound-ai-prompt w-full text-left p-3 rounded-xl bg-slate-700/50 hover:bg-cyan-900/30 border border-white/5 hover:border-cyan-500/50 text-xs transition-all" 
                        data-prompt="O som está abafado e estranho">😕 Som Ruim</button>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">Ações Rápidas Ui</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-ai-clean-channel" class="p-2 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/40 text-xs uppercase font-bold border border-cyan-500/30 text-cyan-400 transition-all" aria-label="Aplicar preset de som limpo ao canal">Som Limpo</button>
                    <button id="btn-ai-hpf" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-600 text-xs uppercase font-bold border border-white/5 transition-all" aria-label="Ativar filtro passa-altos a 100Hz">HPF 100Hz</button>
                    <button id="btn-ai-gate" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-600 text-xs uppercase font-bold border border-white/5 transition-all" aria-label="Ativar noise gate leve">Gate Leve</button>
                    <button id="btn-ai-eq-mud" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-600 text-xs uppercase font-bold border border-white/5 transition-all" aria-label="Cortar frequência de 250Hz para reduzir mudez">Cortar 250Hz</button>
                    <button id="btn-ai-eq-harsh" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-600 text-xs uppercase font-bold border border-white/5 transition-all" aria-label="Cortar frequência de 3.2kHz para reduzir aspureza">Cortar 3.2kHz</button>
                    <button id="btn-ai-afs-on" class="p-2 rounded-lg bg-cyan-900/40 hover:bg-cyan-800/40 text-xs uppercase font-bold border border-cyan-500/30 text-cyan-400 transition-all" aria-label="Ativar supressor automático de feedback">Ativar AFS2</button>
                    <button id="btn-ai-afs-off" class="p-2 rounded-lg bg-red-900/40 hover:bg-red-800/40 text-xs uppercase font-bold border border-red-500/30 text-red-400 transition-all" aria-label="Desativar supressor automático de feedback">Desativar AFS2</button>
                </div>
            </div>
        </div>

        <!-- Chat Principal -->
        <div class="xl:col-span-2 flex flex-col min-h-96 max-h-[calc(100vh-250px)] bg-slate-900/80 border border-white/10 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 bg-slate-800 border-b border-white/10 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span id="chat-status" class="text-sm font-bold">SoundMaster AI</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="btn-ai-listen" class="text-xs uppercase tracking-wider font-bold text-cyan-400 hover:text-cyan-300 transition-colors flex items-center gap-1" title="IA ouve e analisa automaticamente">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        Ouvir & Analisar
                    </button>
                    <button id="btn-clear-chat" class="text-xs uppercase tracking-wider font-bold text-slate-500 hover:text-white transition-colors" aria-label="Limpar histórico da conversa">Limpar</button>
                </div>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-1">
                <!-- Bolhas injetadas via JS -->
            </div>

            <div class="p-4 bg-slate-800/60 border-t border-white/10">
                <div class="flex gap-3">
                    <label for="chat-input" class="sr-only">Digite sua mensagem para a IA</label>
                    <input type="text" id="chat-input" 
                        class="flex-1 bg-black/70 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-cyan-500 outline-none transition-all"
                        placeholder="Ex: Analise o som da sala, Meça o RT60..."
                        aria-label="Digite sua mensagem para a IA">
                    <button id="btn-chat-send" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-cyan-900/30" aria-label="Enviar mensagem para a IA">Enviar</button>
                </div>
            </div>
        </div>
    </div>
</section>
