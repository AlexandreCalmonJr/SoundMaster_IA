<section id="home" class="module page-section active">
    <style>
        /* Skeleton loading pulse */
        .skeleton-pulse {
            background: linear-gradient(90deg, rgba(30,41,59,.4) 25%, rgba(51,65,85,.5) 50%, rgba(30,41,59,.4) 75%);
            background-size: 200% 100%;
            animation: loading-pulse 1.6s infinite ease-in-out;
            border-radius: 4px;
            display: inline-block;
            height: 14px;
            width: 48px;
            vertical-align: middle;
        }
        @keyframes loading-pulse {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Chat scrollbar */
        .home-scroll-chat::-webkit-scrollbar { width: 5px; }
        .home-scroll-chat::-webkit-scrollbar-track { background: transparent; }
        .home-scroll-chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
        .home-scroll-chat::-webkit-scrollbar-thumb:hover { background: rgba(6,182,212,.3); }

        /* F) Smooth intro → chat transition */
        #home-intro-container {
            transition: opacity 0.35s cubic-bezier(.4,0,.2,1), transform 0.35s cubic-bezier(.4,0,.2,1);
        }
        #home-intro-container.hiding {
            opacity: 0;
            transform: translateY(-16px);
            pointer-events: none;
        }

        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(.16,1,.3,1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Prompt pills collapse */
        .prompt-pills-container {
            transition: all 0.3s cubic-bezier(.4,0,.2,1);
            max-height: 44px; opacity: 1; transform: scale(1);
        }
        .prompt-pills-container.collapsed {
            max-height: 0; opacity: 0; transform: scale(.95);
            pointer-events: none; margin: 0 !important; padding: 0 !important; overflow: hidden;
        }

        /* Typing dots */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; }
        .typing-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background-color: rgba(6,182,212,.85);
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -.32s; }
        .typing-dot:nth-child(2) { animation-delay: -.16s; }
        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(.3); opacity: .4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Chat container sizing */
        #home-chat-container {
            flex: 1 1 auto;
            min-height: 300px;
            max-height: 520px;
            width: 100%;
        }

        /* D) Suggestion cards as horizontal pills */
        .suggestion-card {
            transition: all 0.2s cubic-bezier(.16,1,.3,1);
        }
        .suggestion-card:hover {
            border-color: rgba(6,182,212,.35) !important;
            background: rgba(6,182,212,.06) !important;
            color: rgb(6,182,212) !important;
        }
        .suggestion-card-exit { opacity: 0; transform: scale(.94); transition: all .2s ease; }
        .suggestion-card-enter { opacity: 0; transform: translateY(4px); }
        .suggestion-card-enter-active { opacity: 1; transform: translateY(0); transition: all .3s ease; }

        /* E) Quick action compact icons */
        .qa-icon {
            transition: all 0.15s ease;
        }
        .qa-icon:hover {
            color: rgb(6,182,212);
            background: rgba(6,182,212,.1);
        }
        .qa-icon:active { transform: scale(.92); }
        .qa-icon.active-pill {
            background: rgba(6,182,212,.2);
            border-color: rgba(6,182,212,.5);
            color: rgb(6,182,212);
        }

        .chat-bubble { width: fit-content !important; }

        /* Input focus glow */
        .input-composer:focus-within {
            border-color: rgba(6,182,212,.4);
            box-shadow: 0 0 0 1px rgba(6,182,212,.1), 0 4px 24px rgba(6,182,212,.06);
        }
    </style>

    <!-- Hidden AI ring element (preserved for home-page.js binding) -->
    <div id="home-ai-ring" class="hidden"></div>

    <!-- B) Telemetria como Status Bar horizontal no topo -->
    <div class="flex items-center justify-between gap-4 pb-4 mb-6 border-b border-white/10">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></div>
            <span class="text-[10px] font-mono font-bold text-slate-400 uppercase tracking-widest">SoundMaster AI</span>
        </div>
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-1.5 hover:opacity-80 transition-opacity cursor-pointer" data-target="analyzer" title="Analisador SPL">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">SPL</span>
                <span id="home-spl-val" class="text-xs font-mono font-bold text-cyan-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
            <span class="w-px h-3.5 bg-white/10"></span>
            <button class="flex items-center gap-1.5 hover:opacity-80 transition-opacity cursor-pointer" data-target="rt60" title="Medição RT60">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">RT60</span>
                <span id="home-rt60-val" class="text-xs font-mono font-bold text-emerald-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
            <span class="w-px h-3.5 bg-white/10"></span>
            <button class="flex items-center gap-1.5 hover:opacity-80 transition-opacity cursor-pointer" data-target="systems" title="Status Ui24R">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Ui24R</span>
                <span id="home-mixer-status" class="text-xs font-mono font-bold text-red-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
        </div>
    </div>

    <!-- Workspace Principal -->
    <div id="home-workspace-wrapper" class="w-full flex flex-col items-center">

        <!-- Intro Container (Greeting + Suggestion Pills) -->
        <div id="home-intro-container" class="w-full flex flex-col items-center text-center pt-8 pb-4 fade-in-up">

            <!-- C) Greeting com tipografia mais leve e gradiente sutil -->
            <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 mb-2 tracking-tight leading-snug">
                Como posso ajudar no som hoje?
            </h1>
            <p class="text-slate-500 text-xs max-w-sm mx-auto mb-8 leading-relaxed">
                Pergunte, analise ou controle a mesa — tudo por aqui.
            </p>

            <!-- D) Suggestion Cards como pílulas horizontais compactas -->
            <div id="home-suggestion-cards" class="flex flex-wrap gap-2 justify-center w-full max-w-2xl mb-2">
                <!-- JS injeta pílulas aqui via _renderSuggestionCards() -->
            </div>
            <button id="btn-cycle-suggestions" class="text-[10px] text-slate-500 hover:text-cyan-400 mt-1 transition-colors cursor-pointer flex items-center gap-1 font-medium">
                <span>↻</span> <span>Mais sugestões</span>
            </button>
        </div>

        <!-- Chat History Container -->
        <div id="home-chat-container" class="hidden flex-col w-full bg-slate-900/60 border border-white/10 rounded-2xl overflow-hidden shadow-2xl fade-in-up">
            <!-- Chat Header -->
            <div class="px-5 py-2.5 bg-slate-800/40 border-b border-white/10 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Chat Console</span>
                </div>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-1.5 cursor-pointer" title="Executar comandos recomendados de forma autônoma">
                        <input type="checkbox" id="home-toggle-autonomous" class="sr-only peer">
                        <div class="relative w-7 h-3.5 bg-slate-950 rounded-full peer peer-focus:ring-0 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-slate-400 after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-cyan-500 peer-checked:after:bg-white border border-white/10"></div>
                        <span class="text-[9px] font-bold text-slate-400 peer-checked:text-cyan-400 uppercase tracking-wider">Auto</span>
                    </label>
                    <button id="btn-home-export-chat" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-400 transition-colors cursor-pointer">
                        📥
                    </button>
                    <button id="btn-home-new-chat" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-400 transition-colors cursor-pointer flex items-center gap-0.5">
                        <span>+</span> Nova
                    </button>
                </div>
            </div>
            <!-- Messages -->
            <div id="home-chat-messages" class="flex-1 overflow-y-auto p-5 space-y-4 home-scroll-chat text-sm" aria-live="polite">
            </div>
        </div>

        <!-- A) Input como Centro Gravitacional — sempre visível -->
        <div id="home-input-wrapper" class="w-full max-w-2xl mt-4 flex flex-col gap-2">

            <!-- Prompt Pills (colapsam quando tem conversa ativa) -->
            <div id="home-prompt-pills" class="flex gap-1.5 overflow-x-auto pb-1 w-full justify-center prompt-pills-container" style="scrollbar-width:none;-ms-overflow-style:none;">
                <button class="home-prompt-pill px-3 py-1 rounded-full bg-slate-900/50 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-semibold text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="auditar mixer">🔍 Auditar</button>
                <button class="home-prompt-pill px-3 py-1 rounded-full bg-slate-900/50 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-semibold text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="relatório acústico detalhado">📐 Acústica</button>
                <button class="home-prompt-pill px-3 py-1 rounded-full bg-slate-900/50 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-semibold text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="resolver apito microfonia">🚨 Microfonia</button>
                <button class="home-prompt-pill px-3 py-1 rounded-full bg-slate-900/50 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-semibold text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="clarear voz principal">🔊 Clarear Voz</button>
            </div>

            <!-- Composer (Textarea + Toolbar) -->
            <div class="input-composer bg-slate-900/80 border border-white/10 rounded-2xl p-3 transition-all flex flex-col gap-2 w-full shadow-lg">
                <!-- Textarea -->
                <div class="relative w-full">
                    <textarea id="home-chat-input" rows="1" class="w-full bg-transparent border-none text-slate-100 placeholder-slate-500 focus:ring-0 outline-none py-1.5 px-1 resize-none text-sm leading-relaxed" placeholder="Pergunte à IA ou ajuste a mesa... (Ex: clarear voz CH 01)" style="max-height:120px;overflow-y:auto;height:auto;"></textarea>
                    <span id="home-char-counter" class="absolute right-1 bottom-0 text-[9px] text-slate-600 font-mono">0/5000</span>
                </div>
                
                <!-- Toolbar Unificada: Channel + Mic + Analysis + Quick Actions + Send -->
                <div class="flex items-center justify-between border-t border-white/5 pt-2 px-0.5 gap-2">
                    <!-- Lado Esquerdo: Channel + Ferramentas + E) Quick Actions compactas -->
                    <div class="flex items-center gap-1">
                        <!-- Channel Selector -->
                        <select id="home-target-channel" class="bg-slate-950 border border-white/10 rounded-lg px-2 py-1 text-cyan-400 font-mono text-[10px] font-bold focus:border-cyan-500/40 outline-none cursor-pointer" title="Canal Alvo">
                            <option value="1">CH01</option>
                            <option value="2">CH02</option>
                            <option value="3">CH03</option>
                            <option value="4">CH04</option>
                            <option value="5">CH05</option>
                            <option value="6">CH06</option>
                            <option value="7">CH07</option>
                            <option value="8">CH08</option>
                            <option value="9">CH09</option>
                            <option value="10">CH10</option>
                            <option value="11">CH11</option>
                            <option value="12">CH12</option>
                            <option value="13">CH13</option>
                            <option value="14">CH14</option>
                            <option value="15">CH15</option>
                            <option value="16">CH16</option>
                            <option value="17">CH17</option>
                            <option value="18">CH18</option>
                            <option value="19">CH19</option>
                            <option value="20">CH20</option>
                            <option value="21">CH21</option>
                            <option value="22">CH22</option>
                            <option value="23">CH23</option>
                            <option value="24">CH24</option>
                        </select>

                        <span class="w-px h-4 bg-white/5"></span>

                        <!-- Analysis -->
                        <button id="btn-home-send-analysis" class="p-1.5 rounded-lg text-slate-500 hover:text-cyan-400 hover:bg-slate-800/60 transition-all cursor-pointer text-sm" title="Enviar Análise Acústica">📎</button>

                        <!-- Mic / Listen -->
                        <button id="btn-home-listen" class="p-1.5 rounded-lg text-slate-500 hover:text-cyan-400 hover:bg-slate-800/60 transition-all cursor-pointer" title="Escutar e Analisar Áudio">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </button>

                        <span class="w-px h-4 bg-white/5"></span>

                        <!-- E) Quick Actions como ícones compactos inline -->
                        <div id="home-quick-actions" class="flex items-center gap-0.5">
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer" data-action="clean" title="Preset Som Limpo">🔧</button>
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer" data-action="hpf" title="HPF 100Hz">HPF</button>
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer" data-action="gate" title="Gate Leve">G</button>
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer hidden sm:flex" data-action="eq250" title="EQ Cut 250Hz">250</button>
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer hidden sm:flex" data-action="eq3k" title="EQ Cut 3.2kHz">3.2k</button>
                            <button class="qa-icon quick-action-pill p-1.5 rounded-lg text-slate-500 text-[11px] cursor-pointer hidden sm:flex" data-action="afs" title="AFS On/Off">AFS</button>
                        </div>
                    </div>
                    
                    <!-- Lado Direito: Clear + Send -->
                    <div class="flex items-center gap-1.5">
                        <button id="btn-home-clear" class="p-1.5 rounded-full text-slate-500 hover:text-white hover:bg-slate-800/60 transition-all cursor-pointer" style="display:none;" title="Limpar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                        <button id="btn-home-send" class="w-8 h-8 bg-cyan-600/80 hover:bg-cyan-500 text-white rounded-full flex items-center justify-center transition-all cursor-pointer shadow-md shadow-cyan-900/30" aria-label="Enviar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer compacto com link remoto -->
    <footer class="mt-6 text-center text-[10px] text-slate-600 font-mono flex items-center justify-center gap-2 border-t border-white/5 pt-3 pb-1">
        <span>v1.2.0</span>
        <span>·</span>
        <button id="btn-toggle-ip" class="hover:text-cyan-400 transition-colors cursor-pointer">📱 Acesso Remoto</button>
    </footer>

    <!-- QR Code Card retrátil -->
    <div class="bg-slate-900/90 border border-white/10 p-5 rounded-2xl mt-3 hidden w-full max-w-sm mx-auto fade-in-up mb-2 shadow-2xl" id="local-ip-card">
        <h3 class="text-xs font-bold text-cyan-400 mb-2 flex items-center gap-1.5">
            <span>📱</span> Controle Remoto
        </h3>
        <p class="text-[10px] text-slate-400 mb-2">Abra em outro dispositivo na mesma rede:</p>
        <div class="bg-black/40 p-2.5 rounded-xl mb-3 border border-white/5">
            <h2 id="server-ip-display" class="text-xs font-mono text-center text-cyan-400 font-bold">Aguardando IP...</h2>
        </div>
        <div class="flex gap-3 items-center justify-center">
            <a id="mobile-link" href="#" target="_blank" class="text-[10px] font-bold py-2 px-3 bg-cyan-600/30 hover:bg-cyan-600 text-cyan-300 hover:text-white rounded-xl border border-cyan-500/30 transition-all">Abrir</a>
            <div class="bg-white p-1 rounded-lg">
                <img id="home-mobile-qr-code" src="" alt="QR Code" class="w-12 h-12" />
            </div>
        </div>
    </div>
</section>
