<section id="home" class="module page-section active">
    <!-- Inline styles encapsulados para animações do chat e avatar -->
    <style>
        .skeleton-pulse {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.4) 25%, rgba(51, 65, 85, 0.5) 50%, rgba(30, 41, 59, 0.4) 75%);
            background-size: 200% 100%;
            animation: loading-pulse 1.6s infinite ease-in-out;
            border-radius: 4px;
            display: inline-block;
            height: 14px;
            width: 48px;
            vertical-align: middle;
        }
        @keyframes loading-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ai-pulse-core {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, rgba(15, 23, 42, 0.8) 70%, rgba(11, 15, 23, 1) 100%);
            animation: hud-glow 4s ease-in-out infinite;
        }

        .ai-ring-outer.spin-slow {
            animation: spin-anim 25s linear infinite;
        }

        .ai-ring-outer.spin-fast {
            animation: spin-anim 1.5s linear infinite;
        }

        @keyframes spin-anim {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes hud-glow {
            0%, 100% {
                transform: scale(0.98);
                opacity: 0.7;
                filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.3));
            }
            50% {
                transform: scale(1.02);
                opacity: 0.95;
                filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.6));
            }
        }

        /* Estilo da barra de rolagem do chat */
        .home-scroll-chat::-webkit-scrollbar {
            width: 5px;
        }
        .home-scroll-chat::-webkit-scrollbar-track {
            background: transparent;
        }
        .home-scroll-chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .home-scroll-chat::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.3);
        }

        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prompt-pills-container {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 44px;
            opacity: 1;
            transform: scale(1);
        }
        .prompt-pills-container.collapsed {
            max-height: 0;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
            overflow: hidden;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
        }
        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: rgba(6, 182, 212, 0.85);
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        #home-chat-container {
            flex: 1 1 auto;
            min-height: 340px;
            max-height: 580px;
            width: 100%;
        }

        .suggestion-card {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .suggestion-card:hover {
            transform: translateY(-2px);
            border-color: rgba(6, 182, 212, 0.3) !important;
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.12);
        }

        .quick-action-pill {
            transition: all 0.2s ease;
        }
        .quick-action-pill:active {
            transform: scale(0.96);
        }
        .quick-action-pill.active-pill {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.5);
            color: rgb(6, 182, 212);
        }

        .suggestion-card-exit {
            opacity: 0;
            transform: scale(0.94);
            transition: all 0.2s ease;
        }
        .suggestion-card-enter {
            opacity: 0;
            transform: translateY(6px);
        }
        .suggestion-card-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .chat-bubble {
            width: fit-content !important;
        }
    </style>

    <!-- Header Compacto (Telemetria Rápida no Topo) -->
    <header class="flex items-center justify-end gap-6 mb-6">
        <div id="home-ai-ring" class="hidden"></div>
        <!-- Telemetria Rápida no Topo Direito -->
        <div class="flex items-center gap-4 bg-slate-900/80 border border-white/10 px-5 py-2.5 rounded-2xl shadow-xl">
            <button class="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer text-xs" data-target="analyzer" title="Analisador SPL">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">SPL:</span>
                <span id="home-spl-val" class="font-mono font-bold text-cyan-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
            <span class="w-px h-4 bg-white/10"></span>
            <button class="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer text-xs" data-target="rt60" title="Medição RT60">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">RT60:</span>
                <span id="home-rt60-val" class="font-mono font-bold text-emerald-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
            <span class="w-px h-4 bg-white/10"></span>
            <button class="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer text-xs" data-target="systems" title="Status Mesa Ui24R">
                <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Ui24R:</span>
                <span id="home-mixer-status" class="font-mono font-bold text-red-400" aria-live="polite"><span class="skeleton-pulse"></span></span>
            </button>
        </div>
    </header>

    <!-- Workspace Principal -->
    <div id="home-workspace-wrapper" class="w-full space-y-6">

        <!-- Container de Apresentação / Sugestões (Início) -->
        <div id="home-intro-container" class="flex flex-col items-center justify-center w-full text-center fade-in-up py-4">
            <!-- Greeting Text -->
            <h1 class="text-2xl sm:text-3xl font-black text-white mb-1 tracking-tight">
                Como posso ajudar no som hoje?
            </h1>
            <p class="text-slate-400 text-xs sm:text-sm max-w-md mx-auto mb-6 leading-relaxed">
                Assistente inteligente para acústica, alinhamento e mixagem ao vivo
            </p>

            <!-- Suggestion Cards Grid (Full Width Grid igual ao RT60) -->
            <div id="home-suggestion-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 w-full">
            </div>
            <button id="btn-cycle-suggestions" class="text-[10px] font-bold uppercase tracking-wider text-slate-500 hover:text-cyan-400 mt-4 transition-colors cursor-pointer flex items-center gap-1">
                <span>🔄</span> <span>Trocar Sugestões</span>
            </button>
        </div>

        <!-- Chat History Scroll Container (Painel Padrão Glassmorphism) -->
        <div id="home-chat-container" class="hidden flex-col w-full bg-slate-900/80 border border-white/10 rounded-2xl overflow-hidden shadow-2xl fade-in-up">
            <!-- Header bar do Chat -->
            <div class="px-5 py-3 bg-slate-800/40 border-b border-white/10 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-xs font-black uppercase tracking-wider text-slate-200">Chat Console SoundMaster</span>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Autonomous Toggle Switch -->
                    <label class="flex items-center gap-1.5 cursor-pointer" title="Executar comandos recomendados de forma autônoma">
                        <input type="checkbox" id="home-toggle-autonomous" class="sr-only peer">
                        <div class="relative w-8 h-4 bg-slate-950 rounded-full peer peer-focus:ring-0 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-slate-400 after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-cyan-500 peer-checked:after:bg-white border border-white/10"></div>
                        <span class="text-[9px] font-bold text-slate-400 peer-checked:text-cyan-400 uppercase tracking-wider">IA Autônoma</span>
                    </label>
                    <button id="btn-home-export-chat" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-1 cursor-pointer">
                        📥 Exportar
                    </button>
                    <button id="btn-home-new-chat" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-1 cursor-pointer">
                        <span>+</span> Nova Conversa
                    </button>
                </div>
            </div>
            <!-- Messages list -->
            <div id="home-chat-messages" class="flex-1 overflow-y-auto p-5 space-y-4 home-scroll-chat text-sm" aria-live="polite">
                <!-- Injected bubbles -->
            </div>
        </div>

        <!-- Área de Input & Botões na Base (Full Width Grid) -->
        <div id="home-input-wrapper" class="w-full flex flex-col gap-3">
            <!-- Prompts Pills -->
            <div id="home-prompt-pills" class="flex gap-2 overflow-x-auto pb-1 w-full justify-center prompt-pills-container" style="scrollbar-width: none; -ms-overflow-style: none;">
                <button class="home-prompt-pill px-3.5 py-1.5 rounded-xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="auditar mixer">
                    🔍 Auditar Mixer
                </button>
                <button class="home-prompt-pill px-3.5 py-1.5 rounded-xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="relatório acústico detalhado">
                    📐 Relatório Acústico
                </button>
                <button class="home-prompt-pill px-3.5 py-1.5 rounded-xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="resolver apito microfonia">
                    🚨 Resolver Microfonia
                </button>
                <button class="home-prompt-pill px-3.5 py-1.5 rounded-xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-cyan-300 whitespace-nowrap transition-all cursor-pointer" data-prompt="clarear voz principal">
                    🔊 Clarear Voz
                </button>
            </div>

            <!-- Entrada do Chat (Painel Glassmorphism Padrão) -->
            <div class="bg-slate-900/80 border border-white/10 rounded-2xl p-4 focus-within:border-cyan-500/40 transition-all flex flex-col gap-3 w-full shadow-xl">
                <!-- Textarea -->
                <div class="relative w-full">
                    <textarea id="home-chat-input" rows="1" class="w-full bg-transparent border-none text-slate-100 placeholder-slate-500 focus:ring-0 outline-none py-1 px-1 resize-none text-sm leading-relaxed" placeholder="Pergunte à IA ou solicite um ajuste na mesa... (Ex: clarear voz CH 01)" style="max-height: 120px; overflow-y: auto; height: auto;"></textarea>
                    <span id="home-char-counter" class="absolute right-1 bottom-0.5 text-[9px] text-slate-500 font-mono">0/5000</span>
                </div>
                
                <!-- Ações e seletores alinhados -->
                <div class="flex items-center justify-between border-t border-white/5 pt-3 px-1">
                    <div class="flex items-center gap-2">
                        <!-- Channel Selector -->
                        <div class="flex items-center" title="Canal Alvo para Otimização">
                            <label for="home-target-channel" class="sr-only">Canal Alvo</label>
                            <select id="home-target-channel" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-1.5 text-cyan-400 font-mono text-[11px] font-bold focus:border-cyan-500/40 outline-none cursor-pointer">
                                <option value="1">CH 01</option>
                                <option value="2">CH 02</option>
                                <option value="3">CH 03</option>
                                <option value="4">CH 04</option>
                                <option value="5">CH 05</option>
                                <option value="6">CH 06</option>
                                <option value="7">CH 07</option>
                                <option value="8">CH 08</option>
                                <option value="9">CH 09</option>
                                <option value="10">CH 10</option>
                                <option value="11">CH 11</option>
                                <option value="12">CH 12</option>
                                <option value="13">CH 13</option>
                                <option value="14">CH 14</option>
                                <option value="15">CH 15</option>
                                <option value="16">CH 16</option>
                                <option value="17">CH 17</option>
                                <option value="18">CH 18</option>
                                <option value="19">CH 19</option>
                                <option value="20">CH 20</option>
                                <option value="21">CH 21</option>
                                <option value="22">CH 22</option>
                                <option value="23">CH 23</option>
                                <option value="24">CH 24</option>
                            </select>
                        </div>
                        
                        <!-- Acoustic Analysis button -->
                        <button id="btn-home-send-analysis" class="p-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-slate-800/60 transition-all flex items-center justify-center cursor-pointer text-sm" title="Enviar Análise Acústica para IA">
                            📎
                        </button>

                        <!-- Mic button -->
                        <button id="btn-home-listen" class="p-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-slate-800/60 transition-all flex items-center justify-center cursor-pointer" title="IA Escuta e Analisa o Áudio">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                <line x1="12" y1="19" x2="12" y2="23" />
                                <line x1="8" y1="23" x2="16" y2="23" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <!-- Clear Button -->
                        <button id="btn-home-clear" class="p-2 rounded-full text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all flex items-center justify-center cursor-pointer" style="display: none;" title="Limpar texto">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                        
                        <!-- Send Button -->
                        <button id="btn-home-send" class="w-9 h-9 bg-slate-800 hover:bg-cyan-600 hover:text-white text-slate-300 rounded-full flex items-center justify-center transition-all cursor-pointer shadow-md" aria-label="Enviar mensagem">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação Rápida Estruturados em Grid/Vertical Alinhados na Base -->
            <div id="home-quick-actions" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 w-full">
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="clean">
                    🔧 Som Limpo
                </button>
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="hpf">
                    HPF 100Hz
                </button>
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="gate">
                    Gate Leve
                </button>
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="eq250">
                    EQ 250Hz
                </button>
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="eq3k">
                    EQ 3.2kHz
                </button>
                <button class="quick-action-pill px-4 py-3 rounded-2xl bg-slate-900/60 border border-white/5 hover:border-cyan-500/30 hover:bg-cyan-950/20 text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-cyan-400 text-center transition-all cursor-pointer" data-action="afs">
                    AFS On/Off
                </button>
            </div>
        </div>
    </div>

    <!-- Small Footer Link for Remote IP (Collapsible / Compact) -->
    <footer class="mt-8 text-center flex-shrink-0 text-xs text-slate-500 font-medium flex items-center justify-center gap-3 border-t border-white/10 pt-4 pb-2">
        <span>SoundMaster Pro v1.2.0</span>
        <span>•</span>
        <button id="btn-toggle-ip" class="hover:text-cyan-400 transition-colors cursor-pointer">📱 Controle Remoto (iPad/Celular)</button>
    </footer>

    <!-- Retractable Remote IP & QR Code Card -->
    <div class="card bg-slate-900/90 border border-white/10 p-5 rounded-2xl mt-4 hidden w-full max-w-md mx-auto fade-in-up mb-4 shadow-2xl" id="local-ip-card">
        <h3 class="text-xs font-bold text-cyan-400 mb-2 flex items-center gap-1.5">
            <span>📱</span> Controle Remoto (iPad / Celular)
        </h3>
        <p class="text-xs text-slate-400 mb-3">Para abrir este painel em outro dispositivo na mesma rede:</p>
        <div class="bg-black/40 p-3 rounded-xl mb-4 border border-white/5">
            <h2 id="server-ip-display" class="text-sm font-mono text-center text-cyan-400 font-bold">Aguardando IP...</h2>
        </div>
        <div class="flex gap-4 items-center justify-center">
            <a id="mobile-link" href="#" target="_blank" class="text-xs font-bold text-center py-2.5 px-4 bg-cyan-600/30 hover:bg-cyan-600 text-cyan-300 hover:text-white rounded-xl border border-cyan-500/30 transition-all">Abrir Modo Remoto</a>
            <div class="bg-white p-1.5 rounded-xl shadow-lg">
                <img id="home-mobile-qr-code" src="" alt="QR Code" class="w-14 h-14" />
            </div>
        </div>
    </div>
</section>
