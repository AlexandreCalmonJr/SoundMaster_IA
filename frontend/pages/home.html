    <style>
        /* Skeletons */
        .skeleton-pulse {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.4) 25%, rgba(51, 65, 85, 0.5) 50%, rgba(30, 41, 59, 0.4) 75%);
            background-size: 200% 100%;
            animation: loading-pulse 1.6s infinite ease-in-out;
            border-radius: 6px;
            display: inline-block;
            height: 14px;
            width: 50px;
            vertical-align: middle;
        }
        @keyframes loading-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Estilos do Avatar do SoundMaster AI (Claude/Gemini) */
        .ai-pulse-core {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.7) 0%, rgba(37, 99, 235, 0.3) 70%, rgba(15, 23, 42, 0) 100%);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .ai-ring-outer.spin-slow {
            animation: spin-anim 20s linear infinite;
        }

        .ai-ring-outer.spin-fast {
            animation: spin-anim 1.5s linear infinite;
        }

        @keyframes spin-anim {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-glow {
            0%,
            100% {
                transform: scale(0.96);
                opacity: 0.8;
                filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.4));
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.8));
            }
        }

        /* Estilo da barra de rolagem do chat */
        .home-scroll-chat::-webkit-scrollbar {
            width: 5px;
        }

        .home-scroll-chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .home-scroll-chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
        }

        .home-scroll-chat::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.25);
        }

        /* Animações de Fade */
        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Transição e Colapso das Pílulas de Sugestão */
        .prompt-pills-container {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 48px;
            opacity: 1;
            transform: scale(1);
        }
        
        .prompt-pills-container.collapsed {
            max-height: 0;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
            overflow: hidden;
        }


        /* Indicador de Digitação (Typing Loader) */
        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(6, 182, 212, 0.85);
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing-bounce {
            0%, 80%, 100% {
                transform: scale(0.3);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Garantir que o documento e body do iframe ocupem a altura inteira */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Ajustar o preenchimento para descer a caixa de pergunta e aproveitar o espaço */
        #home.page-section {
            padding-bottom: 6px !important;
            padding-top: 16px !important;
        }
        #home-workspace-wrapper {
            padding-bottom: 6px !important;
            padding-top: 12px !important;
        }

        /* Ajuste do layout quando o chat está ativo */
        #home-workspace-wrapper.chat-active {
            justify-content: flex-end !important;
        }

        /* Configuração de tamanho do container de chat com altura máxima responsiva matemática */
                #home-chat-container {

                    min-height: 280px;
                    max-height: calc(100vh - 250px);

                }
                .quick-action-pill:active {
                    transform: scale(0.95);
                }
                .quick-action-pill.active-pill {
                    background: rgba(6, 182, 212, 0.2);
                    border-color: rgba(6, 182, 212, 0.5);
                    color: rgb(6, 182, 212);
                }

                /* Suggestion cards fade transition */
                .suggestion-card-exit {
                    opacity: 0;
                    transform: scale(0.92);
                    transition: all 0.25s ease;
                }
                .suggestion-card-enter {
                    opacity: 0;
                    transform: translateY(8px);
                }
                .suggestion-card-enter-active {
                    opacity: 1;
                    transform: translateY(0);
                    transition: all 0.35s ease;
                }

        /* Ajustar balões para a largura do conteúdo */
        .chat-bubble {
            width: fit-content !important;
        }
