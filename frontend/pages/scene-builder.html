<section id="scene-builder" class="module page-section">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-white">Scene Builder</h2>
            <p class="text-slate-400 text-sm">Crie, nomeie e aplique cenas visuais do seu espetáculo com apoio de IA.</p>
        </div>
        <div class="flex gap-3">
            <button id="sb-new-scene" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold text-sm transition-all shadow-lg shadow-cyan-900/30 flex items-center gap-2">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Cena
            </button>
            <button id="sb-ai-generate" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm transition-all shadow-lg shadow-emerald-900/30 flex items-center gap-2">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Gerar com IA
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
        <div class="xl:col-span-1 space-y-4">
            <div class="bg-slate-800/40 border border-white/10 rounded-2xl p-5">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Cenas Salvas</h3>
                <div id="sb-scene-list" class="space-y-2 max-h-[500px] overflow-y-auto">
                    <div class="text-center text-slate-600 text-xs py-8">Nenhuma cena salva</div>
                </div>
            </div>

            <div class="bg-slate-800/40 border border-white/10 rounded-2xl p-5">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Quick Presets</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button class="sb-quick-preset p-2 rounded-xl bg-cyan-900/20 border border-cyan-500/20 text-xs font-bold text-cyan-400 hover:bg-cyan-900/40 transition-all" data-preset="louvor">Louvor</button>
                    <button class="sb-quick-preset p-2 rounded-xl bg-orange-900/20 border border-orange-500/20 text-xs font-bold text-orange-400 hover:bg-orange-900/40 transition-all" data-preset="pregacao">Pregação</button>
                    <button class="sb-quick-preset p-2 rounded-xl bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-slate-600 transition-all" data-preset="silencio">Silêncio</button>
                    <button class="sb-quick-preset p-2 rounded-xl bg-teal-900/20 border border-teal-500/20 text-xs font-bold text-teal-400 hover:bg-teal-900/40 transition-all" data-preset="transicao">Transição</button>
                </div>
            </div>
        </div>

        <div class="xl:col-span-3">
            <div id="sb-scene-preview" class="bg-slate-900/50 border border-white/10 rounded-2xl overflow-hidden min-h-[400px] flex flex-col">
                <div class="px-6 py-4 bg-slate-800/60 border-b border-white/10 flex items-center justify-between">
                    <div>
                        <span class="text-xs text-slate-500 uppercase tracking-widest">Preview</span>
                        <h3 id="sb-preview-name" class="text-lg font-bold text-white mt-1">Selecione uma cena</h3>
                    </div>
                    <div id="sb-preview-meta" class="text-right text-xs text-slate-500">
                        <div>--</div>
                        <div>--</div>
                    </div>
                </div>
                <div id="sb-preview-content" class="flex-1 p-6 flex flex-col items-center justify-center text-slate-600">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <p class="mt-4 text-sm">Clique em uma cena para visualizar</p>
                </div>
                <div id="sb-preview-actions" class="px-6 py-4 border-t border-white/5 flex gap-3 hidden">
                    <button id="sb-apply-scene" class="flex-1 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold text-sm transition-all">Aplicar na Mesa</button>
                    <button id="sb-delete-scene" class="px-4 py-2.5 bg-red-900/30 hover:bg-red-900/50 text-red-400 rounded-xl font-bold text-sm border border-red-500/30 transition-all">Excluir</button>
                </div>
            </div>

            <div id="sb-thumbnail-grid" class="mt-6 bg-slate-800/40 border border-white/10 rounded-2xl p-5">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Miniaturas</h3>
                <div id="sb-thumbnails" class="grid grid-cols-4 xl:grid-cols-6 gap-3">
                </div>
            </div>
        </div>
    </div>
</section>

<div id="sb-new-scene-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-slate-800 border border-white/10 rounded-2xl w-full max-w-md p-6 shadow-2xl">
        <h3 class="text-lg font-bold text-white mb-5">Nova Cena</h3>
        <div class="space-y-4">
            <div>
                <label for="sb-new-name" class="text-xs text-slate-400 mb-2 block">Nome da Cena</label>
                <input type="text" id="sb-new-name" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 outline-none" placeholder="Ex: Louvor Manhã">
            </div>
            <div>
                <label for="sb-new-genre" class="text-xs text-slate-400 mb-2 block">Gênero / Estilo</label>
                <select id="sb-new-genre" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 outline-none appearance-none">
                    <option value="louvor">Louvor</option>
                    <option value="pregacao">Pregação</option>
                    <option value="musica">Música ao Vivo</option>
                    <option value="transicao">Transição</option>
                    <option value="intervalo">Intervalo</option>
                    <option value="geral">Geral</option>
                </select>
            </div>
            <div>
                <label for="sb-new-desc" class="text-xs text-slate-400 mb-2 block">Descrição (opcional)</label>
                <textarea id="sb-new-desc" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 outline-none resize-none" rows="2" placeholder="Ex: Mix completo com reverb e delay"></textarea>
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button id="sb-cancel-new" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold text-sm transition-all">Cancelar</button>
            <button id="sb-save-new" class="flex-1 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold text-sm transition-all">Salvar Cena</button>
        </div>
    </div>
</div>

<div id="sb-ai-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-slate-800 border border-white/10 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
        <h3 class="text-lg font-bold text-white mb-5">Gerar Cena com IA</h3>
        <div class="space-y-4">
            <div>
                <label for="sb-ai-prompt" class="text-xs text-slate-400 mb-2 block">Descreva o momento do culto</label>
                <textarea id="sb-ai-prompt" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 outline-none resize-none" rows="3" placeholder="Ex: Louvor de abertura com banda completa, preciso de um som energico e aberto…"></textarea>
            </div>
            <div>
                <span class="text-xs text-slate-400 mb-2 block font-medium">Instrumentos Presentes</span>
                <div class="flex flex-wrap gap-2" id="sb-ai-instruments">
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="vocals">Vocais</button>
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="guitar">Guitarra</button>
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="keys">Teclado</button>
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="bass">Baixo</button>
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="drums">Bateria</button>
                    <button class="sb-ai-inst px-3 py-1 rounded-lg bg-slate-700/50 border border-white/5 text-xs font-bold text-slate-300 hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:text-cyan-400 transition-all" data-inst="media">Media</button>
                </div>
            </div>
        </div>
        <div id="sb-ai-result" class="mt-4 hidden bg-slate-900/60 rounded-xl p-3 text-xs text-slate-300 max-h-40 overflow-y-auto"></div>
        <div class="flex gap-3 mt-6">
            <button id="sb-cancel-ai" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold text-sm transition-all">Cancelar</button>
            <button id="sb-generate-ai" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm transition-all">Gerar</button>
        </div>
    </div>
</div>
