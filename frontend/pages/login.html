<section id="login" class="w-full h-full flex items-center justify-center bg-slate-950">
    <div class="w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-900/40 mb-4">
                <span class="text-3xl">🔐</span>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tighter">SoundMaster Pro</h1>
            <p class="text-slate-400 text-sm mt-1">Faça login para continuar</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-username" class="block text-xs font-bold uppercase text-slate-500 tracking-widest mb-2">Username</label>
                <input type="text" id="login-username" required
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 outline-none transition-all"
                    placeholder="Seu username" autocomplete="username">
            </div>

            <div>
                <label for="login-password" class="block text-xs font-bold uppercase text-slate-500 tracking-widest mb-2">Senha</label>
                <input type="password" id="login-password" required
                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 outline-none transition-all"
                    placeholder="Sua senha" autocomplete="current-password">
            </div>

            <div id="login-error" class="hidden text-red-400 text-xs bg-red-900/20 border border-red-500/20 rounded-lg px-4 py-3"></div>

            <button type="submit" id="login-btn"
                class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-cyan-900/30">
                Entrar
            </button>
        </form>

        <p class="text-center text-slate-500 text-xs mt-6">
            Não tem conta?
            <a href="#" id="go-to-register" class="text-cyan-400 hover:text-cyan-300 font-bold">Cadastre-se</a>
        </p>
    </div>
</section>

<script src="../js/pages/auth-forms.js"></script>
