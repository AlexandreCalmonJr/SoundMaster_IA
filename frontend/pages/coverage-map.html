<section id="coverage-map" class="module page-section">
    <div class="flex items-center gap-4 mb-8">
        <span class="p-3 bg-emerald-900/40 rounded-2xl text-2xl">🗺️</span>
        <div>
            <h2 class="text-3xl font-black text-white tracking-tighter">Mapa de Cobertura</h2>
            <p class="text-slate-400 font-medium">Meça SPL e delay em múltiplos pontos da sala e visualize num mapa 2D</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Controls -->
        <div class="lg:col-span-1 space-y-4">
            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5 space-y-4">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-500">Pontos de Medição</h3>
                <div class="flex gap-2">
                    <button id="cv-add-point" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold transition-all">+ Adicionar Ponto</button>
                    <button id="cv-clear-all" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm transition-all">Limpar</button>
                </div>
                <div id="cv-points-list" class="space-y-2 max-h-64 overflow-y-auto">
                    <div class="text-xs text-slate-500 text-center py-4">Nenhum ponto medido ainda.</div>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5 space-y-4">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-500">Configuração</h3>
                <label class="flex items-center gap-2 text-xs text-slate-400">
                    <input type="radio" name="cv-mode" value="spl" checked class="accent-emerald-500">
                    SPL (dB)
                </label>
                <label class="flex items-center gap-2 text-xs text-slate-400">
                    <input type="radio" name="cv-mode" value="delay" class="accent-emerald-500">
                    Delay (ms)
                </label>
                <button id="cv-export-map-btn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold transition-all">↓ Exportar Mapa (CSV)</button>
            </div>
        </div>

        <!-- Map -->
        <div class="lg:col-span-2">
            <div class="bg-slate-800/60 border border-white/10 rounded-2xl p-5">
                <div class="relative bg-black/60 rounded-xl overflow-hidden" style="min-height:400px">
                    <canvas id="cv-map-canvas" class="w-full rounded-xl" style="height:400px; min-height:400px"></canvas>
                    <div id="cv-floorplan-hint" class="absolute top-4 left-4 text-xs text-slate-600 bg-black/60 px-3 py-1.5 rounded-lg backdrop-blur-sm">
                        Clique no mapa para adicionar ponto de medição
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="mt-6 grid grid-cols-4 gap-4">
        <div class="bg-slate-800/40 border border-white/10 rounded-xl p-4 text-center">
            <span class="text-[9px] uppercase font-black text-slate-500 block">Pontos</span>
            <span id="cv-stat-points" class="text-2xl font-black text-white font-mono">0</span>
        </div>
        <div class="bg-slate-800/40 border border-white/10 rounded-xl p-4 text-center">
            <span class="text-[9px] uppercase font-black text-slate-500 block">SPL Médio</span>
            <span id="cv-stat-avg-spl" class="text-2xl font-black text-emerald-400 font-mono">-- dB</span>
        </div>
        <div class="bg-slate-800/40 border border-white/10 rounded-xl p-4 text-center">
            <span class="text-[9px] uppercase font-black text-slate-500 block">Variação</span>
            <span id="cv-stat-variance" class="text-2xl font-black text-amber-400 font-mono">-- dB</span>
        </div>
        <div class="bg-slate-800/40 border border-white/10 rounded-xl p-4 text-center">
            <span class="text-[9px] uppercase font-black text-slate-500 block">Cobertura</span>
            <span id="cv-stat-coverage" class="text-2xl font-black text-cyan-400 font-mono">-- %</span>
        </div>
    </div>
</section>
