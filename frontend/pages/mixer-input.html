<section id="mixer-input" class="module page-section">
    <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-12">
        <div class="flex items-center gap-4">
            <span class="p-3 bg-cyan-900/40 rounded-2xl text-2xl" aria-label="Mix de Entrada">🎤</span>
            <div>
                <h2 class="text-3xl font-black text-white tracking-tighter">Mix de Entrada</h2>
                <p class="text-slate-400 font-medium">Controle dos 24 canais e processamento IA</p>
            </div>
        </div>

        <div class="flex items-center gap-4 bg-slate-900/80 p-4 rounded-2xl border border-white/10 shadow-xl">
            <div class="flex flex-col">
                <label for="mixer-target-select" class="text-xs uppercase font-black text-slate-400 mb-1">Alvo do Mix (Faders):</label>
                <select id="mixer-target-select" class="bg-transparent text-cyan-400 font-black focus:outline-none cursor-pointer uppercase text-xs">
                    <option value="master" class="bg-slate-900">PA / Master Mix</option>
                    <option value="aux1" class="bg-slate-900">Monitor 1 (Pastor)</option>
                    <option value="aux2" class="bg-slate-900">Monitor 2 (Líder)</option>
                    <option value="aux3" class="bg-slate-900">Monitor 3 (Vocal 1)</option>
                    <option value="aux4" class="bg-slate-900">Monitor 4 (Vocal 2)</option>
                    <option value="aux5" class="bg-slate-900">Monitor 5 (Piano)</option>
                    <option value="aux6" class="bg-slate-900">Monitor 6 (Bateria)</option>
                    <option value="aux7" class="bg-slate-900">Monitor 7 (Guit 1)</option>
                    <option value="aux8" class="bg-slate-900">Monitor 8 (Guit 2)</option>
                    <option value="aux9" class="bg-slate-900">Monitor 9 (Side L)</option>
                    <option value="aux10" class="bg-slate-900">Monitor 10 (Side R)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Console de Canais -->
    <div class="bg-slate-900/80 border border-white/10 rounded-xl p-6 overflow-x-auto">
        <div id="mixer-channels-container" class="flex gap-4 pb-4" aria-live="polite">
            <!-- Canais serão injetados dinamicamente via mixer-input-page.js -->
            <div class="flex-1 flex gap-4 opacity-30 italic text-slate-600 items-center justify-center text-xs py-20">
                <span class="flex items-center gap-2"><span aria-hidden="true">🚀</span> Inicializando console de 24 canais…</span>
            </div>
        </div>
    </div>
</section>
