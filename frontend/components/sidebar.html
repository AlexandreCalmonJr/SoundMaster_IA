<!-- Icon Rail -->
<div class="icon-rail">
    <div>
        <div class="rail-logo">SM</div>
        <nav>
            <!-- Dashboard -->
            <button class="rail-btn active" data-target="home" data-direct="true" title="Dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
                <span class="rail-tooltip">Dashboard</span>
            </button>

            <div class="rail-divider"></div>

            <!-- Medir -->
            <button class="rail-btn" data-category="measure" title="Medir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="20" x2="7" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="17" y1="20" x2="17" y2="14"/></svg>
                <span class="rail-tooltip">Medir</span>
            </button>

            <!-- Analisar -->
            <button class="rail-btn" data-category="analysis" title="Analisar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 7 12 10 6 14 18 17 12 21 12"/></svg>
                <span class="rail-tooltip">Analisar</span>
            </button>

            <!-- Mixer -->
            <button class="rail-btn" data-category="mixer" title="Mixer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="21" x2="6" y2="14"/><line x1="6" y1="10" x2="6" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="18" y1="21" x2="18" y2="16"/><line x1="18" y1="12" x2="18" y2="3"/><line x1="3" y1="14" x2="9" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="15" y1="16" x2="21" y2="16"/></svg>
                <span class="rail-tooltip">Mixer</span>
            </button>

            <!-- Automação -->
            <button class="rail-btn" data-category="automation" title="Automação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <span class="rail-tooltip">Automação</span>
            </button>

            <!-- Sistema -->
            <button class="rail-btn" data-category="system" title="Sistema">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
                <span class="rail-tooltip">Sistema</span>
            </button>
        </nav>
    </div>

    <div class="rail-bottom">
        <div class="rail-divider"></div>

        <!-- User info / Logout -->
        <div id="rail-user-info" class="hidden px-2 py-1">
            <span id="rail-username" class="text-[9px] text-slate-400 font-bold truncate block"></span>
            <button id="btn-logout" class="rail-btn w-full text-left mt-1" title="Sair" style="color: var(--danger); font-size: 10px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4"/><polyline points="15 17 20 12 15 7"/><line x1="20" y1="12" x2="9" y2="12"/></svg>
                <span class="rail-tooltip">Sair</span>
            </button>
        </div>

        <!-- Modo Iniciante -->
        <button class="rail-btn" data-target="volunteer-mode" data-direct="true" title="Modo Iniciante">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>
            <span class="rail-tooltip">Modo Iniciante</span>
        </button>

        <!-- Testbed -->
        <button class="rail-btn" data-target="testbed" data-direct="true" title="Testbed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
            <span class="rail-tooltip">Testbed</span>
        </button>

        <!-- Tutoriais -->
        <button class="rail-btn" data-target="tutorials" data-direct="true" title="Tutoriais">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="rail-tooltip">Tutoriais</span>
        </button>
    </div>
</div>

<!-- Category Panel (Expandable flyout) -->
<div class="category-panel" id="category-panel">
    <div class="panel-header">
        <h3 class="panel-title" id="panel-title">Medir</h3>
    </div>
    <nav class="panel-nav" id="panel-nav">
        <!-- Items injected dynamically by layout.js -->
    </nav>
</div>
