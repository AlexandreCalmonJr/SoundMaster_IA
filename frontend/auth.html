<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundMaster Pro — Acesso</title>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" onerror="this.remove()">
    <style>
        :root {
            --bg: #070b12;
            --surface: #101826;
            --surface2: #151f2f;
            --border: rgba(148,163,184,0.16);
            --border-active: rgba(34,211,238,0.50);
            --accent: #22d3ee;
            --accent-glow: rgba(34,211,238,0.18);
            --accent-dim: rgba(34,211,238,0.10);
            --text: #f8fafc;
            --text-sub: #a9b7c9;
            --danger: #fb7185;
            --success: #4ade80;
            --font: 'Outfit', ui-sans-serif, system-ui, sans-serif;
            --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(34,211,238,0.06), transparent 38%);
            pointer-events: none;
        }

        .orb {
            display: none;
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(6,182,212,0.08); top: -150px; right: -100px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(99,102,241,0.06); bottom: -100px; left: -100px; animation-delay: -6s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.05); }
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 46px rgba(0,0,0,0.30);
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .logo-mark {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent), #0891b2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 16px;
            color: #000;
            box-shadow: 0 0 24px var(--accent-glow);
            flex-shrink: 0;
        }
        .logo-text { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
        .logo-sub  { font-size: 0.65rem; color: var(--text-sub); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; }

        .tabs {
            display: flex;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 4px;
            gap: 4px;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            background: transparent;
            color: var(--text-sub);
            font-family: var(--font);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            box-shadow: 0 0 0 1px var(--border-active);
        }

        .form { display: none; flex-direction: column; gap: 1rem; }
        .form.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .field { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-sub); }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--text-sub); }
        input:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        
        /* H5: Real-time validation feedback */
        input.touched:invalid {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        input.touched:valid {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background: var(--accent);
            border: none;
            border-radius: 0.5rem;
            color: #041016;
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            animation: shimmer 1s infinite;
        }
        @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        .msg {
            font-size: 0.78rem;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .msg.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #f87171; display: block; }
        .msg.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #4ade80; display: block; }

        .divider {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.65rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em;
            margin: 0.25rem 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 1.25rem;
        }
        .hint span { color: var(--accent); cursor: pointer; font-weight: 600; }
        .hint span:hover { text-decoration: underline; }

        .version {
            position: absolute;
            top: 1rem; right: 1rem;
            font-family: var(--mono);
            font-size: 0.6rem;
            color: var(--text-sub);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 2px 8px;
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
    <span class="version">v1.2.0</span>

    <div class="logo">
        <div class="logo-mark">SM</div>
        <div>
            <div class="logo-text">SoundMaster Pro</div>
            <div class="logo-sub">Acoustic Intelligence</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Criar Conta</button>
    </div>

    <form class="form active" id="form-login" onsubmit="handleLogin(event)">
        <div id="login-msg" class="msg"></div>

        <div class="field">
            <label for="login-username">Usuário</label>
            <input type="text" id="login-username" placeholder="seu username" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">Entrar no SoundMaster</button>
    </form>

    <form class="form" id="form-register" onsubmit="handleRegister(event)">
        <div id="register-msg" class="msg"></div>

        <div class="field">
            <label for="reg-username">Usuário</label>
            <input type="text" id="reg-username" placeholder="escolha um username" minlength="3" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="reg-email">E-mail</label>
            <input type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="field">
            <label for="reg-password">Senha</label>
            <input type="password" id="reg-password" placeholder="mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-register">Criar Conta</button>
    </form>

    <div class="hint" id="hint-login">
        Sem conta? <span onclick="switchTab('register')">Cadastre-se</span>
    </div>
    <div class="hint" id="hint-register" style="display:none">
        Já tem conta? <span onclick="switchTab('login')">Entrar</span>
    </div>
</div>

<script src="js/pages/auth-page.js"></script>
<script src="js/services/auth.service.js"></script>
<script src="js/services/python-installer.service.js"></script>
</body>
</html>
